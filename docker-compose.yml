services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: destek_asistani
      POSTGRES_PASSWORD: destek_asistani
      POSTGRES_DB: destek_asistani
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
